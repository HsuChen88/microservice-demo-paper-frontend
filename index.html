<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>論文管理系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: #fff;
      padding: 1.2rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    header h1 { font-size: 1.4rem; font-weight: 600; }
    header p  { font-size: .85rem; opacity: .85; margin-top: .25rem; }

    .container {
      max-width: 960px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    /* ── Tabs ─────────────────────────────── */
    .tabs {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.2rem;
    }

    .tab-btn {
      padding: .55rem 1.2rem;
      border: none;
      border-radius: 6px;
      background: #fff;
      color: #555;
      cursor: pointer;
      font-size: .9rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      transition: all .15s;
    }

    .tab-btn:hover { background: #e8f0fe; color: #1a73e8; }
    .tab-btn.active { background: #1a73e8; color: #fff; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Cards ────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .card h3 { font-size: 1rem; margin-bottom: .8rem; color: #1a73e8; }

    /* ── Form ─────────────────────────────── */
    .form-group { margin-bottom: .8rem; }

    .form-group label {
      display: block;
      font-size: .8rem;
      color: #666;
      margin-bottom: .25rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: .5rem .7rem;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: .9rem;
      transition: border .15s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #1a73e8;
    }

    textarea { resize: vertical; min-height: 60px; }

    .btn {
      padding: .5rem 1.2rem;
      border: none;
      border-radius: 5px;
      font-size: .85rem;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn:hover { opacity: .85; }

    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-secondary { background: #5f6368; color: #fff; }
    .btn-sm { padding: .35rem .8rem; font-size: .8rem; }

    /* ── Table ────────────────────────────── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }

    th, td {
      text-align: left;
      padding: .6rem .8rem;
      border-bottom: 1px solid #eee;
    }

    th { color: #666; font-weight: 600; font-size: .8rem; text-transform: uppercase; }

    tr:hover td { background: #f8fafd; }

    .status-badge {
      display: inline-block;
      padding: .15rem .5rem;
      border-radius: 10px;
      font-size: .75rem;
      font-weight: 600;
    }

    .status-SUBMITTED  { background: #e8f0fe; color: #1a73e8; }
    .status-APPROVED   { background: #e6f4ea; color: #1e8e3e; }
    .status-REJECTED   { background: #fce8e6; color: #d93025; }
    .status-CATALOGED  { background: #fef7e0; color: #f9ab00; }

    /* ── Alert ────────────────────────────── */
    .alert {
      padding: .6rem 1rem;
      border-radius: 5px;
      margin-bottom: .8rem;
      font-size: .85rem;
    }

    .alert-success { background: #e6f4ea; color: #1e8e3e; }
    .alert-error   { background: #fce8e6; color: #d93025; }

    .hidden { display: none; }

    /* ── Loading ──────────────────────────── */
    .loading {
      text-align: center;
      color: #999;
      padding: 2rem;
      font-size: .9rem;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 2rem;
    }

    /* ── Toolbar ──────────────────────────── */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .8rem;
    }

    footer {
      text-align: center;
      color: #999;
      font-size: .75rem;
      padding: 1.5rem 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Paper Management System</h1>
  <p>Microservice Demo &mdash; Submission + Catalog</p>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab-btn active" data-tab="submit">Submit Paper</button>
    <button class="tab-btn" data-tab="submissions">Submissions</button>
    <button class="tab-btn" data-tab="catalog">Catalog</button>
  </div>

  <!-- ── Submit Paper ─────────────────────────── -->
  <div id="tab-submit" class="tab-panel active">
    <div class="card">
      <h3>Submit a New Paper</h3>
      <div id="submit-alert" class="alert hidden"></div>
      <form id="submit-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input id="title" name="title" required placeholder="e.g. Deep Learning for NLP">
        </div>
        <div class="form-group">
          <label for="author">Author</label>
          <input id="author" name="author" required placeholder="e.g. Alice Chen">
        </div>
        <div class="form-group">
          <label for="abstractText">Abstract</label>
          <textarea id="abstractText" name="abstractText" required placeholder="Brief summary of your paper..."></textarea>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="button" class="btn btn-secondary" onclick="generateTestData()">Generate</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Submissions List ─────────────────────── -->
  <div id="tab-submissions" class="tab-panel">
    <div class="card">
      <div class="toolbar">
        <h3>All Submissions</h3>
        <button class="btn btn-secondary btn-sm" onclick="loadSubmissions()">Refresh</button>
      </div>
      <div id="submissions-body">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <!-- ── Catalog ──────────────────────────────── -->
  <div id="tab-catalog" class="tab-panel">
    <div class="card">
      <div class="toolbar">
        <h3>Paper Catalog</h3>
        <button class="btn btn-secondary btn-sm" onclick="loadCatalog()">Refresh</button>
      </div>
      <div id="catalog-body">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

</div>

<footer>Paper Management System &copy; 2026 &mdash; Microservice Demo</footer>

<script>
/* ═══════════════════════════════════════════════════════════
   Vanilla JS — no dependencies
   ═══════════════════════════════════════════════════════════ */

// API base paths (relative — same origin through Istio gateway)
const API = {
  submissions: '/api/v1/submissions',
  catalog:     '/api/v1/catalog',
};

// ── Tab switching ────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

    // Auto-load data when switching tabs
    if (btn.dataset.tab === 'submissions') loadSubmissions();
    if (btn.dataset.tab === 'catalog') loadCatalog();
  });
});

// ── Submit Paper ─────────────────────────────────────────
document.getElementById('submit-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alert = document.getElementById('submit-alert');
  alert.className = 'alert hidden';

  const body = {
    title:        document.getElementById('title').value.trim(),
    author:       document.getElementById('author').value.trim(),
    abstractText: document.getElementById('abstractText').value.trim(),
  };

  try {
    const res = await fetch(API.submissions, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    alert.className = 'alert alert-success';
    alert.textContent = 'Paper submitted successfully! ID: ' + (data.id || JSON.stringify(data));
    e.target.reset();
  } catch (err) {
    alert.className = 'alert alert-error';
    alert.textContent = 'Submission failed: ' + err.message;
  }
});

// ── Load Submissions ─────────────────────────────────────
async function loadSubmissions() {
  const container = document.getElementById('submissions-body');
  container.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const res = await fetch(API.submissions);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data || (Array.isArray(data) && data.length === 0)) {
      container.innerHTML = '<div class="empty-state">No submissions yet.</div>';
      return;
    }

    const rows = (Array.isArray(data) ? data : [data]);
    container.innerHTML = `
      <table>
        <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Status</th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${r.id || '-'}</td>
              <td>${esc(r.title)}</td>
              <td>${esc(r.author)}</td>
              <td><span class="status-badge status-${r.status || ''}">${r.status || '-'}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (err) {
    container.innerHTML = '<div class="alert alert-error">Failed to load: ' + esc(err.message) + '</div>';
  }
}

// ── Load Catalog ─────────────────────────────────────────
async function loadCatalog() {
  const container = document.getElementById('catalog-body');
  container.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const res = await fetch(API.catalog);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data || (Array.isArray(data) && data.length === 0)) {
      container.innerHTML = '<div class="empty-state">Catalog is empty.</div>';
      return;
    }

    const rows = (Array.isArray(data) ? data : [data]);
    container.innerHTML = `
      <table>
        <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Status</th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${r.paper_id || r.id || '-'}</td>
              <td>${esc(r.title)}</td>
              <td>${esc(r.author)}</td>
              <td><span class="status-badge status-${r.status || 'CATALOGED'}">${r.status || 'CATALOGED'}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  } catch (err) {
    container.innerHTML = '<div class="alert alert-error">Failed to load: ' + esc(err.message) + '</div>';
  }
}

// ── Generate Test Data ───────────────────────────────────
function generateTestData() {
  const titles = [
    'Deep Learning Approaches for Natural Language Processing',
    'Machine Learning in Healthcare: A Comprehensive Survey',
    'Blockchain Technology for Secure Data Management',
    'Neural Networks for Image Recognition',
    'Quantum Computing: Current State and Future Prospects',
    'Distributed Systems Architecture for Microservices',
    'AI-Driven Solutions for Climate Change',
    'Cybersecurity in the Age of IoT',
    'Reinforcement Learning for Autonomous Vehicles',
    'Cloud Computing Optimization Strategies'
  ];

  const authors = [
    'Alice Chen',
    'Bob Zhang',
    'Carol Wang',
    'David Liu',
    'Emma Wu',
    'Frank Lin',
    'Grace Huang',
    'Henry Chen',
    'Iris Tang',
    'Jack Zhou'
  ];

  const abstracts = [
    'This paper presents a novel approach to solving complex problems in the field. We propose a new methodology that combines traditional techniques with modern innovations, resulting in significant improvements in performance and efficiency.',
    'In this study, we investigate the application of advanced algorithms to real-world scenarios. Our experimental results demonstrate substantial gains over existing methods, with particular emphasis on scalability and reliability.',
    'We introduce a comprehensive framework that addresses key challenges in the domain. Through extensive evaluation, we show that our solution outperforms state-of-the-art approaches while maintaining computational efficiency.',
    'This research explores innovative techniques for enhancing system capabilities. Our contributions include theoretical analysis, practical implementation, and empirical validation across multiple datasets.',
    'We present a systematic investigation of emerging trends and their implications. The findings reveal important insights that can guide future research directions and practical applications.'
  ];

  const randomTitle = titles[Math.floor(Math.random() * titles.length)];
  const randomAuthor = authors[Math.floor(Math.random() * authors.length)];
  const randomAbstract = abstracts[Math.floor(Math.random() * abstracts.length)];

  document.getElementById('title').value = randomTitle;
  document.getElementById('author').value = randomAuthor;
  document.getElementById('abstractText').value = randomAbstract;
}

// ── Utility ──────────────────────────────────────────────
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
</script>

</body>
</html>
